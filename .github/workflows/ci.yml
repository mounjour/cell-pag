name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    env:
      # DEBUG nao tem valor padrao em config/settings.py — precisa vir de algum
      # lugar mesmo em CI, onde nao existe .env.
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Checagem do Django (config/imports)
        run: python manage.py check

      - name: Migracoes pendentes (modelo alterado sem migration)
        run: python manage.py makemigrations --check --dry-run

      - name: Checagem de producao (check --deploy)
        env:
          DEBUG: "False"
          SECRET_KEY: ci-somente-para-checagem-0123456789-0123456789-0123456789
        run: python manage.py check --deploy

      - name: Rodar a suite de testes
        run: python -m pytest -n auto

  segredos:
    name: Procurar segredos commitados (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historico completo, gitleaks varre todos os commits

      - name: Baixar o gitleaks (binario, sem precisar de licenca)
        env:
          # Autenticado: 5000 requisicoes/hora (por repositorio) em vez de 60/hora
          # por IP — sem isso, o IP compartilhado dos runners do GitHub Actions
          # estoura o limite com frequencia e o passo falha sem motivo real.
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=$(curl -sSf --retry 3 --retry-delay 2 -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -Po '"tag_name": "v\K[^"]*')
          curl -sSfL --retry 3 --retry-delay 2 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Rodar o gitleaks
        run: >
          ./gitleaks detect --source . --redact --verbose
          --baseline-path .gitleaks-baseline.json
