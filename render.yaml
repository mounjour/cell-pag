# Blueprint do Render — cria de uma vez o site e os crons. Passo a passo e o
# que preencher à mão: docs/DEPLOY.md.
#
# Banco: Postgres gerenciado pelo Supabase (decidido 16/09) — não é mais
# provisionado aqui pelo Render. Crie o projeto no Supabase e cole a connection
# string em DATABASE_URL no grupo de variáveis abaixo (painel do Render).
#
# Depois de subir para o GitHub: Render → New → Blueprint → aponta para este repo.

# Variáveis compartilhadas entre o site e os crons (o resto é preenchido no painel).
envVarGroups:
  - name: cell-pag-config
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Connection string do Postgres do Supabase (Settings → Database →
      # Connection string → URI). Prefira o "connection pooling" (porta 6543)
      # em vez da conexão direta, pra aguentar os workers do Gunicorn + crons.
      - key: DATABASE_URL
        sync: false
      # ALLOWED_HOSTS não é definido aqui de propósito: o settings.py usa o
      # RENDER_EXTERNAL_HOSTNAME (host real do serviço). Um curinga como
      # ".onrender.com" aceitaria o header Host de qualquer app do Render.
      # Para domínio próprio, defina ALLOWED_HOSTS no painel com o host exato.
      # Lembrete diário da Yslane (E.164, ex.: +5583988887777)
      - key: YSLANE_WHATSAPP_NUMERO
        sync: false
      # WhatsApp via Evolution API — mantém "log" até ter uma instância da
      # Evolution conectada (docs/WHATSAPP.md). Depois troca para "evolution".
      - key: WHATSAPP_PROVIDER
        value: log
      - key: WHATSAPP_PIX_CHAVE
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        sync: false
      - key: EVOLUTION_WEBHOOK_TOKEN
        sync: false
      # Pix Cora — mantém "log" até ter CoraPro + certificado mTLS (docs/CORA.md).
      - key: CORA_PROVIDER
        value: log
      - key: CORA_CLIENT_ID
        sync: false
      - key: CORA_CERT_PATH
        sync: false
      - key: CORA_KEY_PATH
        sync: false
      - key: CORA_TOKEN_URL
        sync: false
      - key: CORA_API_BASE_URL
        sync: false
      - key: CORA_WEBHOOK_TOKEN
        generateValue: true

services:
  # ── Site ────────────────────────────────────────────────────────────────────
  - type: web
    name: cell-pag
    runtime: python
    # "starter" (~US$ 7/mês): exigido para montar disco persistente (o plano
    # "free" não suporta disco). De brinde, tira o cold-start de ~1 min.
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate" # roda as migrações antes de trocar a versão no ar
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /entrar/
    # Disco para os anexos (comprovantes, documentos). Sem ele, MEDIA_ROOT é
    # efêmero e os arquivos somem a cada deploy. O caminho tem de bater com o
    # MEDIA_ROOT do settings.py (BASE_DIR/"media"). O cron NÃO precisa de disco.
    disk:
      name: media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: WEB_CONCURRENCY
        value: "2"
      - fromGroup: cell-pag-config

  # ── Rotina diária (cron) ───────────────────────────────────────────────────
  # 11:30 UTC = 08:30 em America/Sao_Paulo (UTC−3). Gera vencimentos, monta o
  # lembrete da Yslane e prepara/dispara as cobranças — nesta ordem.
  - type: cron
    name: cell-pag-rotina-diaria
    runtime: python
    plan: free
    schedule: "30 11 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py rotina_diaria"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - fromGroup: cell-pag-config

  # ── Retry das cobranças WhatsApp (cron, 21/09) ────────────────────────────
  # Roda de novo `enviar_cobrancas_clientes` mais duas vezes no dia. É seguro
  # sem risco de mensagem duplicada: `processar_cobrancas()` (cobranca.py) pula
  # quem já está enviado/entregue/lido — só tenta de novo quem ficou `erro` ou
  # `pendente` (ex.: a Evolution API caiu bem na hora do cron das 08:30).
  # Cobre o caso de falha no envio automático ao cliente sem precisar de retry
  # dentro da própria chamada HTTP (que arriscaria mandar a mesma mensagem
  # duas vezes em caso de timeout ambíguo — ver PLANO-DO-PROJETO.md, seção 10).
  - type: cron
    name: cell-pag-retry-cobrancas-meio-dia
    runtime: python
    plan: free
    schedule: "30 15 * * *" # 15:30 UTC = 12:30 BRT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py enviar_cobrancas_clientes"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - fromGroup: cell-pag-config

  - type: cron
    name: cell-pag-retry-cobrancas-tarde
    runtime: python
    plan: free
    schedule: "30 19 * * *" # 19:30 UTC = 16:30 BRT
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py enviar_cobrancas_clientes"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - fromGroup: cell-pag-config
