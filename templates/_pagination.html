{% if is_paginated %}
  <div class="pagination">
    {% if page_obj.has_previous %}
      <a class="btn secondary" href="?{% if busca %}q={{ busca|urlencode }}&{% endif %}{% if status_atual %}status={{ status_atual }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>
    {% endif %}
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn secondary" href="?{% if busca %}q={{ busca|urlencode }}&{% endif %}{% if status_atual %}status={{ status_atual }}&{% endif %}page={{ page_obj.next_page_number }}">Próxima</a>
    {% endif %}
  </div>
{% endif %}
