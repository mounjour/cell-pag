{% extends "base.html" %}
{% block title %}Entrar · Acompanhamento de Pagamentos{% endblock %}

{% block content %}
<div class="login-box">
  <h1>Entrar</h1>
  {% if form.errors %}
    <ul class="messages"><li class="msg error">Usuário ou senha inválidos.</li></ul>
  {% endif %}
  <form method="post" class="form-grid">
    {% csrf_token %}
    {% include "_form.html" %}
    <div class="form-actions">
      <button type="submit" class="btn">Entrar</button>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
