{% extends "base.html" %}
{% block title %}Login · Acompanhamento de Pagamentos{% endblock %}

{% block content %}
<div class="login-box">
  <h1>Login</h1>
  {% if form.errors %}
    <p class="msg error">Usuário ou senha inválidos.</p>
  {% endif %}
  <form method="post" class="form-grid">
    {% csrf_token %}
    {% include "_form.html" %}
    <button type="submit" class="btn btn-block">Entrar</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
