{% extends "base.html" %}
{% load static %}
{% block title %}Cobrar hoje{% endblock %}
{% block wrap_class %}wrap--wide{% endblock %}

{% block content %}
<div class="toolbar">
  <h1>Cobrar hoje · {{ hoje|date:"d/m/Y" }}</h1>
  <span class="spacer"></span>
  <form method="get">
    <select name="estrutura" data-auto-submit>
      <option value="">Todos os tipos</option>
      {% for valor, rotulo in estrutura_opcoes %}
        <option value="{{ valor }}" {% if valor == estrutura_atual %}selected{% endif %}>{{ rotulo }}</option>
      {% endfor %}
    </select>
    <button class="btn secondary" type="submit">Filtrar</button>
  </form>
</div>

{% include "pagamentos/_cobrar_hoje_painel.html" %}

<dialog id="dialog-registrar" class="dialog-registrar" aria-label="Registrar pagamento">
  <div id="dialog-registrar-corpo"></div>
</dialog>
{% endblock %}

{% block scripts %}
  <script src="{% static 'js/filtros.js' %}"></script>
  <script src="{% static 'js/htmx.min.js' %}"></script>
  <script src="{% static 'js/cobrar_hoje.js' %}"></script>
{% endblock %}
